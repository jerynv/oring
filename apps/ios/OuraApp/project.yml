# Native direct-Bluetooth iPhone app. Generate with xcodegen generate.
name: OuraApp
options:
  bundleIdPrefix: com.jerynv
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "27"
    PRODUCT_BUNDLE_IDENTIFIER: com.jerynv.oring
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only (no iPad multitasking orientation reqs)
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: OuraApp.entitlements
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  OuraApp:
    type: application
    platform: iOS
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        TARGETED_DEVICE_FAMILY: "1"   # iPhone-only (target-level, overrides xcodegen's 1,2 default)
        OTHER_LDFLAGS: [-lsqlite3]
    sources:
      - path: OuraApp.swift
      - path: SampleData.swift
      - path: SampleSummary.json
        buildPhase: resources
      - path: Models.swift
      - path: Core.swift
      - path: WorkCoordinator.swift
      - path: Components.swift
      - path: Reports.swift
      - path: DayExport.swift
      - path: RawData.swift
      - path: HeartRate.swift
      - path: Theme.swift
      - path: BLETransport.swift
      - path: RingSync.swift
      - path: ProfileSettings.swift
      - path: ModelProgress.swift
      - path: CrashCatch.c
      - path: CrashCatch.h
      - path: Diagnostics.swift
      - path: ../generated/oura_core.swift
      - path: Assets.xcassets
    dependencies:
      - framework: ../OuraCore.xcframework
        embed: false

  OuraAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TestsUI
    dependencies:
      - target: OuraApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  OuraAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: OuraApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OuraApp:
    build:
      targets:
        OuraApp: all
    test:
      targets: [OuraAppTests, OuraAppUITests]
